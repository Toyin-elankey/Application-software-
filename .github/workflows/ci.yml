name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, unit and spec tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run db:baseline:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run prisma:validate
      - run: npm run build

  database:
    name: Migrations, seed and database tests (PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-throwaway
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: ci-throwaway
      DATABASE_URL: postgresql://ci:ci-throwaway@localhost:5432/commerce_test
      SHADOW_DATABASE_URL: postgresql://ci:ci-throwaway@localhost:5432/commerce_shadow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - name: Create throwaway databases
        run: |
          psql -h localhost -U ci -d postgres -c "CREATE DATABASE commerce_test" \
            -c "CREATE DATABASE commerce_shadow" -c "CREATE DATABASE commerce_deploy_check"
      - name: Migrate and seed the test database, then run database tests
        run: npm run test:db
      - name: Prisma Migrate accepts the migrations (migrate deploy)
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://ci:ci-throwaway@localhost:5432/commerce_deploy_check
      - name: Baseline migration matches the Prisma schema (no drift)
        run: |
          rm -rf /tmp/baseline-only && mkdir -p /tmp/baseline-only/0001_baseline
          cp prisma/migrations/0001_baseline/migration.sql /tmp/baseline-only/0001_baseline/
          cp prisma/migrations/migration_lock.toml /tmp/baseline-only/
          npx prisma migrate diff --from-migrations /tmp/baseline-only --to-schema prisma/schema.prisma --exit-code

  e2e:
    name: End-to-end tests (Playwright)
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t application-software-web:ci .

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
