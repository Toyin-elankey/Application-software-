# Local development stack: PostgreSQL plus the web app.
# Copy .env.example to .env and set real local values. The defaults below are for local use only.
# Ports are bound to 127.0.0.1 so nothing is exposed to the network.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
      POSTGRES_DB: commerce_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d commerce_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      APP_BASE_URL: http://localhost:3000
      LOG_LEVEL: info
      DATABASE_URL: postgresql://app_user:${POSTGRES_PASSWORD:-change-me-local-only}@db:5432/commerce_dev?schema=public
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  db-data:
